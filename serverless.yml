service: serverless-fastapi-scheduler-template
frameworkVersion: '4'

provider:
  name: aws
  runtime: python3.11
  architecture: arm64
  region: ${env:AWS_REGION, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  memorySize: ${self:custom.stages.${self:provider.stage}.memorySize, 512}
  timeout: ${self:custom.stages.${self:provider.stage}.timeout, 29}
  logRetentionInDays: ${self:custom.stages.${self:provider.stage}.logRetentionInDays, 14}
  environment:
    STAGE: ${self:provider.stage}
    API_BASE_PATH: ${env:API_BASE_PATH, ''}
    ROOT_PATH: ${env:ROOT_PATH, ''}
    API_BEARER_TOKEN: ${env:API_BEARER_TOKEN, ''}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: "*"
        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource:
            - !GetAtt NightlyCleanupUtcDlq.Arn
            - !GetAtt SyncThingsUtcDlq.Arn

package:
  individually: false
  patterns:
    - '!tests/**'
    - '!events/**'
    - '!**/__pycache__/**'
    - '!**/*.pyc'
    - '!node_modules/**'
    - '!package.json'
    - '!package-lock.json'
    - '!.venv/**'
    - '!.git/**'
    - '!.github/**'
    - '!.serverless/**'
    - '!.pytest_cache/**'
    - '!.ruff_cache/**'
    - '!.mypy_cache/**'
    - '!*.md'
    - '!.env*'
    - '!pyproject.toml'
    - '!uv.lock'
    - '!.python-version'
    - '!Makefile'

custom:
  pythonRequirements:
    useUv: false
    dockerizePip: true
    installer: uv
  stages:
    dev:
      memorySize: 512
      timeout: 29
      taskTimeout: 300
      logRetentionInDays: 7
      schedulesEnabled: false
    prod:
      memorySize: 1024
      timeout: 29
      taskTimeout: 300
      logRetentionInDays: 30
      schedulesEnabled: true

functions:
  api:
    handler: src/handlers/http_handler.handler
    events:
      - httpApi:
          method: ANY
          path: /{proxy+}

  # Scheduled tasks: one shared handler, TASK_ID picks the task from the
  # registry, and each schedule's `input` becomes the task parameters.
  nightlyCleanupUtc:
    handler: src/handlers/task_handlers.task_handler
    description: Nightly cleanup at 02:00 UTC
    timeout: ${self:custom.stages.${self:provider.stage}.taskTimeout}
    environment:
      TASK_ID: nightly-cleanup
    events: ${file(./events/nightly-cleanup.yml):events}

  syncThingsUtc:
    handler: src/handlers/task_handlers.task_handler
    description: Sync things on a schedule
    timeout: ${self:custom.stages.${self:provider.stage}.taskTimeout}
    environment:
      TASK_ID: sync-things
    events: ${file(./events/sync-things.yml):events}

resources:
  Resources:
    NightlyCleanupUtcDlq:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: !Sub "${self:service}-${self:provider.stage}-nightly-utc-dlq"
        MessageRetentionPeriod: 1209600

    SyncThingsUtcDlq:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: !Sub "${self:service}-${self:provider.stage}-sync-utc-dlq"
        MessageRetentionPeriod: 1209600

    NightlyCleanupUtcInvokeConfig:
      Type: AWS::Lambda::EventInvokeConfig
      Properties:
        FunctionName: !Ref NightlyCleanupUtcLambdaFunction
        Qualifier: "$LATEST"
        MaximumRetryAttempts: 2
        DestinationConfig:
          OnFailure:
            Destination: !GetAtt NightlyCleanupUtcDlq.Arn

    SyncThingsUtcInvokeConfig:
      Type: AWS::Lambda::EventInvokeConfig
      Properties:
        FunctionName: !Ref SyncThingsUtcLambdaFunction
        Qualifier: "$LATEST"
        MaximumRetryAttempts: 2
        DestinationConfig:
          OnFailure:
            Destination: !GetAtt SyncThingsUtcDlq.Arn

  Outputs:
    ApiEndpoint:
      Description: HTTP API endpoint URL
      Value: !Sub "https://${HttpApi}.execute-api.${self:provider.region}.amazonaws.com"
